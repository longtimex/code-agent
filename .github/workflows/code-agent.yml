name: Code Agent Review & Security Audit

on:
  pull_request:
    branches: [ main, master, develop ]
  push:
    branches: [ main, master ]

jobs:
  code-audit:
    runs-on: ubuntu-latest
    env:
      # The package is not published to PyPI; run it straight from the source tree.
      PYTHONPATH: src
      # Windows consoles default to a legacy code page; force UTF-8 for output.
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Unit Tests
        run: python -m unittest discover -s tests -v

      - name: Run Code Analysis Agent
        # `tests/` holds intentional vulnerability fixtures (fake keys, eval
        # calls); scanning them would trip the gate on the test data itself.
        run: python -m code_agent scan . --ci-github --exclude tests --fail-on high
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
